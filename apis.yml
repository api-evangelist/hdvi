aid: hdvi
name: HDVI (High Definition Vehicle Insurance)
description: >-
  HDVI (High Definition Vehicle Insurance) is a Chicago-based commercial trucking
  insurance company delivering modern, data-driven coverage for small and mid-size
  fleet operators. Its flagship HDVI Shift product uses integrated telematics and
  safety data to dynamically price premiums, rewarding safe driving with monthly
  discounts of up to 20 percent, and its Fleet Portal gives fleets tools to improve
  safety, reduce risk, maintain compliance, and lower costs. HDVI was added to the
  API Evangelist network as a portfolio company of 8vc. As of this enrichment pass
  the company publishes no public developer portal, API documentation, SDKs, or
  OpenAPI; it operates a customer-facing Fleet Portal and telematics/ELD/dash-cam
  partner integrations rather than an open developer program. This profile captures
  the company's real public identity, its published llms.txt, its SOC 2 Type 2
  compliance posture, and domain-security posture.
